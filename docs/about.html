let currentIndex = 0;

function openLightbox(index) {
  currentIndex = index;
  updateLightbox();
  document.getElementById("lightbox").classList.add("active");
  document.body.style.overflow = "hidden";
}

function updateLightbox() {
  const photo = photos[currentIndex];
  const img = document.getElementById("lightbox-img");
  let videoEl = document.getElementById("lightbox-video");

  if (photo.isVideo) {
    img.style.display = "none";
    if (!videoEl) {
      videoEl = document.createElement("video");
      videoEl.id = "lightbox-video";
      videoEl.controls = true;
      videoEl.style.cssText = "max-width:90vw;max-height:78vh;border-radius:8px;";
      img.parentNode.insertBefore(videoEl, img);
    }
    videoEl.src = photo.src;
    videoEl.style.display = "block";
    videoEl.play();
  } else {
    img.style.display = "block";
    img.src = photo.src;
    img.alt = photo.caption;
    if (videoEl) { videoEl.pause(); videoEl.style.display = "none"; }
  }

  document.getElementById("lightbox-caption").textContent = photo.caption;
}

function closeLightbox() {
  document.getElementById("lightbox").classList.remove("active");
  document.body.style.overflow = "";
  const videoEl = document.getElementById("lightbox-video");
  if (videoEl) videoEl.pause();
}

function closeLightboxOnBg(event) {
  if (event.target === document.getElementById("lightbox")) closeLightbox();
}

function navigateLightbox(dir) {
  currentIndex = (currentIndex + dir + photos.length) % photos.length;
  updateLightbox();
}

document.addEventListener("keydown", (e) => {
  const lb = document.getElementById("lightbox");
  if (!lb.classList.contains("active")) return;
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowRight") navigateLightbox(1);
  if (e.key === "ArrowLeft") navigateLightbox(-1);
});
</script>

      let selectedAnnoteEl;

        let lineAttr = 'data-code-annotation="' +  annotation + '"';

      const selectCodeLines = (annoteEl) => {
        const doc = window.document;

        const targetAnnotation = annoteEl.getAttribute("data-target-annotation");
        const annoteSpan = window.document.querySelector(selectorForAnnotation(targetCell, targetAnnotation));

        const lineIds = lines.map((line) => {
          return targetCell + "-" + line;
        })
        let top = null;
        let height = null;
        let parent = null;
        if (lineIds.length > 0) {
            //compute the position of the single el (top and bottom and make a div)
            const el = window.document.getElementById(lineIds[0]);
            top = el.offsetTop;
            height = el.offsetHeight;
            parent = el.parentElement.parentElement;
          if (lineIds.length > 1) {
            const lastEl = window.document.getElementById(lineIds[lineIds.length - 1]);
            const bottom = lastEl.offsetTop + lastEl.offsetHeight;
            height = bottom - top;
          }
          if (top !== null && height !== null && parent !== null) {
            // cook up a div (if necessary) and position it 
            let div = window.document.getElementById("code-annotation-line-highlight");
            if (div === null) {
              div = window.document.createElement("div");
              div.setAttribute("id", "code-annotation-line-highlight");
              div.style.position = 'absolute';
              parent.appendChild(div);
            }
            div.style.top = top - 2 + "px";
            div.style.height = height + 4 + "px";
            div.style.left = 0;
            let gutterDiv = window.document.getElementById("code-annotation-line-highlight-gutter");
            if (gutterDiv === null) {

            gutterDiv.style.top = top - 2 + "px";
            gutterDiv.style.height = height + 4 + "px";
          }

        }

      const unselectCodeLines = () => {
        const elementsIds = ["code-annotation-line-highlight", "code-annotation-line-highlight-gutter"];
        elementsIds.forEach((elId) => {

          if (div) {

    function throttle(fn, ms) {
    let throttle = false;
    let timer;
      return (...args) => {
        if(!throttle) { // first call gets through
            fn.apply(this, args);
            throttle = true;
        } else { // all the others get throttled
            if(timer) clearTimeout(timer); // cancel #2
            timer = setTimeout(() => {
              fn.apply(this, args);
              timer = throttle = false;
            }, ms);
        }
      };

            selectCodeLines(clickedEl);
            clickedEl.classList.add('code-annotation-active');
